<div class="container">
  <h1>Hello angular</h1>

  <hr />

  <button (click)="toggleCard()">ShowElement</button>

  <input type="text" [(ngModel)]="props.name" />
  <input type="text" [(ngModel)]="props.age" />

  <button (click)="addCard()">AddCard</button>

  <hr />

  <div *ngIf="props.state; else noCards">
    <app-card
      *ngFor="let item of cards; let idx = index"
      [card]="item"
      [index]="idx + 1"></app-card>
  </div>

  <ul>
    <li *ngFor="let i of date; let ixd = index">
      <div>
        <b>{{ ixd + 1 }}</b> ---
        {{ i.toDateString() | date: 'medium' | uppercase }}
      </div>
    </li>
  </ul>
