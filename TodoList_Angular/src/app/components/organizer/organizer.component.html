<section>
  <header>
    Today: <strong>{{dateService.date | async | moment: 'DD.MM.YY'}}</strong>
    <hr/>
  </header>

  <main>
    <ul *ngIf="tasks.length; else noTasks">
      <li class="task" *ngFor="let task of tasks; let i = index">
           <span class="loh">
             <strong>{{i + 1}}</strong>
             {{task.title}}
           </span>
        <button class="remove" (click)="remove(task)"></button>
      </li>
    </ul>

    <ng-template #noTasks>
      <p class="text-center">???????????????</p>
    </ng-template>
  </main>


  <footer>
    <form class="inputPlus" (ngSubmit)="submit()" [formGroup]="form">

      <input type="text" formControlName="title">

      <button
        type="submit"
        class="button__plus"
        [disabled]="form.invalid"
      ></button>

    </form>
  </footer>
</section>
