<div class="section">
  <div class="header">
    Today: <strong>{{ dateService.date | async | moment: "DD.MM.YY" }}</strong>
    <hr />
  </div>

  <div>
    <ul *ngIf="tasks.length; else noTasks">
      <li class="task" *ngFor="let task of tasks; let i = index">
        <span class="loh">
          <strong>{{ i + 1 }}</strong>
          {{ task.title }}
        </span>
        <button class="edit"></button>
        <button class="remove" (click)="remove(task)"></button>
      </li>
    </ul>
    <ng-template #noTasks>
      <p class="text-center">There are currently no tasks...</p>
    </ng-template>
  </div>

  <div>
    <form class="inputPlus" (ngSubmit)="submit()" [formGroup]="form">
      <input
        type="text"
        formControlName="title"
        class="inputPlusTitle"
        placeholder="Type here..."
      />
      <button class="inputPlusButton" [disabled]="form.invalid"></button>
    </form>
  </div>
</div>
